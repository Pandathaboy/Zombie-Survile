<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Zombie Survival</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#1d2417;touch-action:none;user-select:none;-webkit-user-select:none}canvas{display:block;width:100%;height:100%}</style>
</head><body><canvas id="game"></canvas><script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let W,H;function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight}addEventListener('resize',resize);resize();

// ===== PLAYER SKINS (color = default shirt color, or src:'assets/pic.png') =====
const playerSkins=[{name:'Soldier',color:'#3b82f6'},{name:'Ranger',color:'#22c55e'},{name:'Rebel',color:'#ef4444'},{name:'Ghost',color:'#e5e7eb'},{name:'Gold',color:'#facc15'}];
// ===== ZOMBIE TYPES: you start with the first 3, a new one unlocks every 10 waves. Add more lines to add more! =====
const zombieTypes=[
 {hp:2,speed:1,size:70,skin:'#3f9e2f',shirt:'#e6a23c'},
 {hp:4,speed:.7,size:95,skin:'#2d7a3a',shirt:'#3b82f6'},
 {hp:1,speed:1.5,size:55,skin:'#8bc34a',shirt:'#c0392b'},
 {hp:3,speed:1.1,size:75,skin:'#6a8f9a',shirt:'#7c3aed'},
 {hp:6,speed:.8,size:105,skin:'#7a5c8f',shirt:'#111827'},
 {hp:5,speed:1.3,size:80,skin:'#b5651d',shirt:'#14b8a6'}];
zombieTypes.forEach(t=>{if(t.src){t.img=new Image();t.img.src=t.src}});
playerSkins.forEach(s=>{if(s.src){s.img=new Image();s.img.src=s.src}});
const PAL=[null,'#ef4444','#f97316','#facc15','#22c55e','#06b6d4','#3b82f6','#a855f7','#ec4899','#f5f5f5','#111827'];
// ===== BANNERS: the boss of wave 1 drops the first one, wave 2 the second, and so on. Add more lines to add more! =====
// sym can be: star skull brain bolt crown diamond heart circle
const BANNERS=[
 {n:'Survivor',c1:'#2f7d32',c2:'#d7f5c9',sym:'star'},{n:'Brain Snack',c1:'#7b2d8e',c2:'#f3a6c8',sym:'brain'},
 {n:'Skull Flag',c1:'#1a1a1a',c2:'#f2f2f2',sym:'skull'},{n:'Sun Blaze',c1:'#e8590c',c2:'#ffe066',sym:'circle'},
 {n:'Thunder',c1:'#1d4ed8',c2:'#facc15',sym:'bolt'},{n:'Royal',c1:'#6d28d9',c2:'#fcd34d',sym:'crown'},
 {n:'Frostbite',c1:'#0e7490',c2:'#e0f7ff',sym:'diamond'},{n:'Blood Moon',c1:'#450a0a',c2:'#ef4444',sym:'circle'},
 {n:'Heartless',c1:'#be123c',c2:'#fecdd3',sym:'heart'},{n:'Gold Rush',c1:'#92400e',c2:'#fbbf24',sym:'star'},
 {n:'Night Watch',c1:'#0f172a',c2:'#cbd5e1',sym:'skull'},{n:'Zombie King',c1:'#166534',c2:'#fde047',sym:'crown'}];
// ===== ARMOUR (weakest to strongest). red = damage you take, cost = safe coins, ch = chance a zombie spawns with it =====
const ARM=[
 {n:'Leather',c:'#8b5a2b',red:.9,cost:100,ch:.12},{n:'Iron',c:'#b0b7bf',red:.8,cost:300,ch:.06},
 {n:'Gold',c:'#f5c518',red:.7,cost:700,ch:.03},{n:'Diamond',c:'#4dd9e8',red:.55,cost:1500,ch:.012},
 {n:'Ruby',c:'#d6193a',red:.4,cost:3000,ch:.005}];
// ===== GUNS (mag = bullets per magazine, rel = reload seconds) =====
const GUNS={
 pistol:{n:'Pistol',d:'Free starter gun',delay:.25,dmg:1,pel:1,spr:0,spd:600,len:20,col:'#444',cost:0,mag:12,rel:1},
 revolver:{n:'Revolver',d:'Slow but hits hard',delay:.55,dmg:2.2,pel:1,spr:0,spd:700,len:22,col:'#8a6d3b',cost:120,mag:6,rel:1.4},
 smg:{n:'SMG',d:'Fast, weaker bullets',delay:.09,dmg:.7,pel:1,spr:.12,spd:650,len:26,col:'#2a2a2a',cost:200,mag:30,rel:1.3},
 shotgun:{n:'Shotgun',d:'5 pellets at once',delay:.7,dmg:1,pel:5,spr:.4,spd:550,len:32,col:'#6b3e1e',cost:350,mag:6,rel:1.8},
 assault:{n:'Assault Rifle',d:'Fast and accurate',delay:.12,dmg:1,pel:1,spr:.05,spd:750,len:30,col:'#3a4a2a',cost:500,mag:30,rel:1.5},
 rifle:{n:'Rifle',d:'Hits very hard',delay:.32,dmg:3,pel:1,spr:0,spd:900,len:36,col:'#1d3b2a',cost:700,mag:8,rel:1.6},
 sniper:{n:'Sniper',d:'One huge shot',delay:1,dmg:8,pel:1,spr:0,spd:1100,len:40,col:'#222',cost:1000,mag:4,rel:2.2},
 minigun:{n:'Minigun',d:'Bullet storm',delay:.05,dmg:.6,pel:1,spr:.25,spd:650,len:34,col:'#555',cost:1800,mag:120,rel:3.2}};
const BOT_COST=1000,PLAYER_SPEED=220;

// ===== Saved stuff (safe coins, gold, armour, mods, paint, banners) =====
let sv={safe:0,gold:0,own:[0,0,0,0,0],armour:-1,mag:0,rel:0,shirt:null,gunc:null,botc:null,ban:[],hung:[-1,-1,-1,-1]};
try{Object.assign(sv,JSON.parse(localStorage.getItem('zs_save')||'{}'))}catch(e){}
while(sv.ban.length<BANNERS.length)sv.ban.push(0);
while(sv.hung.length<4)sv.hung.push(-1);
function save(){try{localStorage.setItem('zs_save',JSON.stringify(sv))}catch(e){}}
const magSize=k=>Math.round(GUNS[k].mag*(1+.25*sv.mag)),relTime=k=>GUNS[k].rel*Math.pow(.85,sv.rel);

// ===== State =====
let state='device',device='pc',skinIndex=0,T=0,gtab=0,selBan=-1;
let garageFrom='menu'; // where BACK goes from the garage: 'menu' or 'shop'
try{skinIndex=Math.min(+localStorage.getItem('skin')||0,playerSkins.length-1)}catch(e){}
let player,bullets,zombies,score,coins,spawnTimer,shotTimer,up,owned,gun,bot,wave,spawned,bossSpawned,waveDelay,banner,ammo,reloadT,drops=[],note={t:0,txt:''};
const joy={active:false,dx:0,dy:0},mouse={x:0,y:0,down:false,used:false},keys={};let fireHeld=false;

function startGame(){
 player={x:W/2,y:H/2,hp:100,maxhp:100,angle:0};
 bullets=[];zombies=[];drops=[];note={t:0,txt:''};score=0;coins=0;shotTimer=0;spawnTimer=0;
 up={hp:0,rate:0,dmg:0};owned={pistol:1};gun='pistol';bot=null;
 wave=1;spawned=0;bossSpawned=false;waveDelay=2.5;banner={t:2.5,txt:'WAVE 1'};
 ammo=magSize('pistol');reloadT=0;
 joy.active=false;joy.dx=joy.dy=0;fireHeld=false;mouse.down=false;state='play'}
function openShop(){state='shop';mouse.down=false;joy.active=false;joy.dx=joy.dy=0;fireHeld=false}
function equip(k){gun=k;ammo=magSize(k);reloadT=0}
function chooseSkin(i){skinIndex=i;try{localStorage.setItem('skin',i)}catch(e){}}
function chooseDevice(d){device=d;state='menu'}
function inRect(x,y,r){return x>r.x&&x<r.x+r.w&&y>r.y&&y<r.y+r.h}
const pauseR=()=>({x:W-106,y:16,w:90,h:40}),backR=()=>({x:W/2-100,y:H-58,w:200,h:44});
const resumeR=()=>({x:W/2-210,y:H-58,w:200,h:44}),shopGarageR=()=>({x:W/2+10,y:H-58,w:200,h:44});
function leaveGarage(){state=garageFrom;garageFrom='menu'}

// ===== Generic item lists (used by shop + garage) =====
const NEON=['#ff2e93','#00e5ff','#b6ff00','#ffd400','#a855f7','#ff7a00'];
function layout(its,top){
 const cols=W>800?3:W>520?2:1,rows=Math.ceil(its.length/cols),gap=8;
 const bw=Math.min(430,(W-40-(cols-1)*gap)/cols),bh=Math.max(40,Math.min(70,(H-top-76-(rows-1)*gap)/rows));
 const sx=W/2-(cols*bw+(cols-1)*gap)/2;
 return its.map((_,i)=>({x:sx+(i%cols)*(bw+gap),y:top+Math.floor(i/cols)*(bh+gap),w:bw,h:bh}))}
function fit(s,x,y,mw,px,col,al,b){ctx.fillStyle=col;ctx.textAlign=al;let f=px;do{ctx.font=(b?'bold ':'')+f+'px sans-serif';f--}while(ctx.measureText(s).width>mw&&f>8);ctx.fillText(s,x,y)}
function drawItems(its,rs,g){its.forEach((it,i)=>{
 const r=rs[i],[s,ok]=it.st();
 if(g){ // graffiti sticker style
  ctx.fillStyle='#000';ctx.fillRect(r.x+4,r.y+4,r.w,r.h);
  ctx.fillStyle=ok?'#0e5a30':'#1a1420';ctx.fillRect(r.x,r.y,r.w,r.h);
  ctx.strokeStyle=it.hl?'#ffd400':NEON[i%6];ctx.lineWidth=it.hl?5:3;ctx.strokeRect(r.x,r.y,r.w,r.h);
  ctx.fillStyle=NEON[i%6];ctx.fillRect(r.x,r.y,6,r.h)}
 else{
  ctx.fillStyle=ok?'#1f6f3a':'#000a';ctx.fillRect(r.x,r.y,r.w,r.h);
  ctx.strokeStyle=it.hl?'#ffd84a':'#fff4';ctx.lineWidth=2;ctx.strokeRect(r.x,r.y,r.w,r.h)}
 fit(it.n,r.x+(g?14:10),r.y+r.h/2-3,r.w*.58,16,'#fff','left',1);
 fit(s,r.x+r.w-10,r.y+r.h/2-3,r.w*.36,14,ok?'#ffd84a':'#aaa','right',1);
 fit(it.d,r.x+(g?14:10),r.y+r.h/2+15,r.w-24,12,'#ccc','left',0)})}
function button(r,label,color,size){ctx.fillStyle=color;ctx.fillRect(r.x,r.y,r.w,r.h);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold '+size+'px sans-serif';ctx.fillText(label,r.x+r.w/2,r.y+r.h/2+size/3)}

// ===== Shop (in-game, coins) =====
function items(){
 const L=[];
 const upg=(k,n,d,base,step,max,fn)=>{const lv=up[k],c=base+step*lv;L.push({n:n+'  Lv '+lv+'/'+max,d,st:()=>lv>=max?['MAX',0]:[c+' coins',coins>=c],buy(){if(lv<max&&coins>=c){coins-=c;up[k]++;if(fn)fn()}}})};
 upg('hp','More Health','+25 max HP and heal up',30,25,10,()=>{player.maxhp+=25;player.hp=player.maxhp});
 upg('rate','Faster Shooting','Shoot quicker',40,30,8);
 upg('dmg','Stronger Bullets','Every bullet hits harder',60,50,8);
 for(const k in GUNS){const g=GUNS[k];L.push({n:g.n,d:g.d,hl:gun===k,st:()=>owned[k]?[gun===k?'EQUIPPED':'Tap to equip',0]:[g.cost+' coins',coins>=g.cost],buy(){if(owned[k])equip(k);else if(coins>=g.cost){coins-=g.cost;owned[k]=1;equip(k)}}})}
 L.push({n:'Bot Buddy',d:'Wanders around and shoots',st:()=>bot?['OWNED',0]:[BOT_COST+' coins',coins>=BOT_COST],buy(){if(!bot&&coins>=BOT_COST){coins-=BOT_COST;bot={x:player.x+40,y:player.y,tx:0,ty:0,t:0,cd:0,a:0}}}});
 L.push({n:'Safe',d:'Keep coins if you die. In safe: '+sv.safe,st:()=>['Deposit '+coins,coins>0],buy(){sv.safe+=coins;coins=0;save()}});
 return L}
function shopPress(x,y){
 const its=items(),rs=layout(its,92);
 its.forEach((it,i)=>{if(inRect(x,y,rs[i]))it.buy()});
 if(inRect(x,y,resumeR()))state='play';
 else if(inRect(x,y,shopGarageR())){garageFrom='shop';state='garage'}}

// ===== Garage (menu or shop, uses safe coins + gold) =====
const TABS=['ARMOUR','MODS','PAINT','BANNERS'];
function tabRects(){const w=Math.min(100,(W-40-24)/4),s=W/2-(4*w+24)/2;return TABS.map((_,i)=>({x:s+i*(w+8),y:62,w,h:34}))}
function garageItems(){
 if(gtab===0)return ARM.map((a,i)=>({n:a.n+' Armour',d:Math.round((1-a.red)*100)+'% less damage taken',hl:sv.armour===i,
  st:()=>sv.own[i]?[sv.armour===i?'WORN (tap: off)':'Tap to wear',0]:[a.cost+' coins',sv.safe>=a.cost],
  buy(){if(sv.own[i])sv.armour=sv.armour===i?-1:i;else if(sv.safe>=a.cost){sv.safe-=a.cost;sv.own[i]=1;sv.armour=i}save()}}));
 const m=(k,n,d)=>{const lv=sv[k],c=2+lv;return{n:n+'  Lv '+lv+'/5',d,st:()=>lv>=5?['MAX',0]:[c+' gold',sv.gold>=c],buy(){if(lv<5&&sv.gold>=c){sv.gold-=c;sv[k]++;save()}}}};
 return[m('mag','Bigger Magazines','+25% ammo per level (gold drops from bosses)'),m('rel','Faster Reload','15% quicker per level (gold drops from bosses)')]}
function paintLayout(){
 const gap=6,sw=Math.min(40,Math.max(24,(W-200)/PAL.length-gap)),x0=W/2-(PAL.length*(sw+gap)-gap)/2,sp=Math.min(76,(H-188)/3);
 return{gap,sw,x0,rows:[{label:'Clothes',key:'shirt',y:124},{label:'Guns',key:'gunc',y:124+sp},{label:'Bot helper',key:'botc',y:124+2*sp}]}}

// Banner wall + collection layout
function banLayout(){
 const n=BANNERS.length,cols=6,rows=Math.ceil(n/cols),gap=6,top=128;
 const ch=Math.max(34,Math.min(70,(H-66-top-30-rows*gap)/(1+rows))),cw=ch*.8;
 return{n,cols,rows,gap,top,ch,cw,wx0:W/2-(4*(cw+gap)-gap)/2,gx0:W/2-(cols*(cw+gap)-gap)/2,gy0:top+ch+30}}
function banPress(x,y){
 const B=banLayout();
 for(let k=0;k<4;k++)if(sv.hung[k]>=0&&inRect(x,y,{x:B.wx0+k*(B.cw+B.gap),y:B.top,w:B.cw,h:B.ch})){sv.hung[k]=-1;save();return}
 BANNERS.forEach((b,i)=>{
  const r={x:B.gx0+(i%B.cols)*(B.cw+B.gap),y:B.gy0+Math.floor(i/B.cols)*(B.ch+B.gap),w:B.cw,h:B.ch};
  if(!inRect(x,y,r))return;
  selBan=i;if(!sv.ban[i])return;
  const h=sv.hung.indexOf(i);
  if(h>=0)sv.hung[h]=-1;else{let s=sv.hung.indexOf(-1);if(s<0)s=3;sv.hung[s]=i}
  save()})}
function garagePress(x,y){
 tabRects().forEach((r,i)=>{if(inRect(x,y,r))gtab=i});
 if(inRect(x,y,backR())){leaveGarage();return}
 if(gtab<2){const its=garageItems(),rs=layout(its,108);its.forEach((it,i)=>{if(inRect(x,y,rs[i]))it.buy()})}
 else if(gtab===2){const P=paintLayout();P.rows.forEach(r=>PAL.forEach((c,j)=>{if(inRect(x,y,{x:P.x0+j*(P.sw+P.gap),y:r.y+8,w:P.sw,h:P.sw})){sv[r.key]=c;save()}}))}
 else banPress(x,y)}

// ===== Menus =====
function deviceRects(){const w=Math.min(340,W-40),h=80,x=W/2-w/2;return{touch:{x,y:H/2-h-10,w,h},pc:{x,y:H/2+10,w,h}}}
function menuLayout(){
 const n=playerSkins.length,gap=12,size=Math.min(90,(W-40-(n-1)*gap)/n),startX=W/2-(n*size+(n-1)*gap)/2,y=H/2-size/2;
 return{size,gap,startX,y,play:{x:W/2-210,y:y+size+60,w:200,h:56},garage:{x:W/2+10,y:y+size+60,w:200,h:56},change:{x:16,y:16,w:220,h:36}}}
function press(x,y){
 if(state==='device'){const R=deviceRects();if(inRect(x,y,R.touch))chooseDevice('touch');else if(inRect(x,y,R.pc))chooseDevice('pc')}
 else if(state==='menu'){
  const L=menuLayout();
  playerSkins.forEach((s,i)=>{const sx=L.startX+i*(L.size+L.gap);if(x>sx&&x<sx+L.size&&y>L.y&&y<L.y+L.size)chooseSkin(i)});
  if(inRect(x,y,L.play))startGame();else if(inRect(x,y,L.garage)){garageFrom='menu';state='garage'}else if(inRect(x,y,L.change))state='device'}
 else if(state==='over')state='menu';
 else if(state==='shop')shopPress(x,y);
 else if(state==='garage')garagePress(x,y);
 else if(state==='play'&&inRect(x,y,pauseR())){openShop();return true}}

// ===== PC controls =====
addEventListener('keydown',e=>{
 const k=e.key.toLowerCase();keys[k]=true;
 if(state==='device'){if(k==='1'||k==='t')chooseDevice('touch');if(k==='2'||k==='l')chooseDevice('pc')}
 else if(state==='menu'){const n=parseInt(e.key);if(n>=1&&n<=playerSkins.length)chooseSkin(n-1);if(k==='enter')startGame();if(k==='g'){garageFrom='menu';state='garage'}}
 else if(state==='garage'){if(k==='escape')leaveGarage()}
 else if(state==='over'){if(k==='enter')state='menu'}
 else if(state==='play'){if(k==='p'||k==='escape')openShop()}
 else if(state==='shop'){if(k==='p'||k==='escape'||k==='enter')state='play';if(k==='g'){garageFrom='shop';state='garage'}}});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
canvas.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;mouse.used=true});
canvas.addEventListener('mousedown',e=>{mouse.used=true;if(!press(e.clientX,e.clientY)&&state==='play')mouse.down=true});
addEventListener('mouseup',()=>mouse.down=false);

// ===== Touch controls: joystick bottom-left, FIRE bottom-right =====
function ctl(){const r=Math.max(50,Math.min(65,W/8));return{jx:r+50,jy:H-r-50,jr:r,bx:W-r-50,by:H-r-50,br:r*.85}}
function handleTouch(e){
 e.preventDefault();
 if(e.type==='touchstart')for(const t of e.changedTouches)if(press(t.clientX,t.clientY))return;
 if(state==='play'&&device==='touch'){
  const c=ctl();joy.active=false;joy.dx=joy.dy=0;fireHeld=false;
  for(const t of e.touches){
   if(t.clientX<W/2&&!joy.active){const vx=t.clientX-c.jx,vy=t.clientY-c.jy,len=Math.hypot(vx,vy),k=Math.min(len,c.jr)/c.jr;joy.active=true;joy.dx=len?vx/len*k:0;joy.dy=len?vy/len*k:0}
   else if(Math.hypot(t.clientX-c.bx,t.clientY-c.by)<c.br*1.5)fireHeld=true}}}
['touchstart','touchmove','touchend','touchcancel'].forEach(n=>canvas.addEventListener(n,handleTouch,{passive:false}));

// ===== Game logic =====
function nearest(x,y,max){let n=null,best=max;for(const z of zombies){const d=Math.hypot(z.x-x,z.y-y);if(d<best){best=d;n=z}}return n}
function spawn(boss){
 const side=Math.floor(Math.random()*4),x=side===0?-60:side===1?W+60:Math.random()*W,y=side===2?-60:side===3?H+60:Math.random()*H;
 const pool=zombieTypes.slice(0,Math.min(zombieTypes.length,3+Math.floor((wave-1)/10)));
 const t=boss?pool[(wave-1)%pool.length]:pool[Math.floor(Math.random()*pool.length)];
 let arm=-1;
 if(!boss){const r=Math.random();let acc=0;for(let i=4;i>=0;i--){acc+=ARM[i].ch;if(r<acc){arm=i;break}}}
 const hp=boss?30+wave*12:t.hp*(1+.04*(wave-1))*(arm>=0?1+.5*(arm+1):1);
 zombies.push({x,y,hp,max:hp,boss,arm,speed:boss?55+wave:(50+Math.random()*40+Math.min(wave*3,60))*t.speed,size:boss?170:t.size,skin:t.skin,shirt:t.shirt,img:t.img,flip:false,ph:Math.random()*6})}

function update(dt){
 let mx=0,my=0;
 if(device==='touch'){mx=joy.dx;my=joy.dy}
 else{if(keys.w||keys.arrowup)my--;if(keys.s||keys.arrowdown)my++;if(keys.a||keys.arrowleft)mx--;if(keys.d||keys.arrowright)mx++}
 const ml=Math.hypot(mx,my);if(ml>1){mx/=ml;my/=ml}
 player.x=Math.max(20,Math.min(W-20,player.x+mx*PLAYER_SPEED*dt));
 player.y=Math.max(40,Math.min(H-20,player.y+my*PLAYER_SPEED*dt));

 // Collect banners by walking over them
 for(let k=drops.length-1;k>=0;k--){const d=drops[k];
  if(Math.hypot(player.x-d.x,player.y-d.y)<45){
   sv.ban[d.i]++;save();note={t:3.5,txt:(sv.ban[d.i]===1?'NEW BANNER: ':'Banner again: ')+BANNERS[d.i].n};drops.splice(k,1)}}
 note.t-=dt;

 let shooting=false;
 if(device==='touch'){
  const n=nearest(player.x,player.y,1e9);
  if(n)player.angle=Math.atan2(n.y-player.y,n.x-player.x);else if(ml>.2)player.angle=Math.atan2(my,mx);
  shooting=fireHeld}
 else if(mouse.used){player.angle=Math.atan2(mouse.y-player.y,mouse.x-player.x);shooting=mouse.down||keys[' ']}

 const G=GUNS[gun],delay=G.delay*Math.pow(.88,up.rate),dmg=G.dmg*(1+.35*up.dmg);
 shotTimer-=dt;
 if(reloadT>0){reloadT-=dt;if(reloadT<=0)ammo=magSize(gun)}
 else if(shooting&&shotTimer<=0&&ammo>0){
  shotTimer=delay;ammo--;
  for(let i=0;i<G.pel;i++){const a=player.angle+(Math.random()-.5)*G.spr;
   bullets.push({x:player.x+Math.cos(player.angle)*G.len,y:player.y+Math.sin(player.angle)*G.len,vx:Math.cos(a)*G.spd,vy:Math.sin(a)*G.spd,life:1.2,dmg})}
  if(ammo<=0)reloadT=relTime(gun)}
 if(keys.r&&reloadT<=0&&ammo<magSize(gun))reloadT=relTime(gun);

 if(bot){
  bot.t-=dt;
  if(bot.t<=0){bot.tx=player.x+(Math.random()-.5)*320;bot.ty=player.y+(Math.random()-.5)*320;bot.t=.8+Math.random()*2}
  const dx=bot.tx-bot.x,dy=bot.ty-bot.y,d=Math.hypot(dx,dy)||1;

 bullets.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt});bullets=bullets.filter(b=>b.life>0);

function ci(x,y,r,f){ctx.fillStyle=f;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.stroke()}
function bx(x,y,w,h,f){ctx.fillStyle=f;ctx.fillRect(x,y,w,h);ctx.strokeRect(x,y,w,h)}
function poly(p){ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)ctx.lineTo(p[i][0],p[i][1]);ctx.closePath();ctx.fill()}
function symbol(b,cx,cy,s){
 ctx.fillStyle=b.c2;
 switch(b.sym){
  case'star':{const p=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?s*.45:s;p.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r])}poly(p);break}
  case'skull':ctx.beginPath();ctx.arc(cx,cy-s*.15,s*.85,0,7);ctx.fill();ctx.fillRect(cx-s*.45,cy+s*.4,s*.9,s*.55);
   ctx.fillStyle=b.c1;ctx.beginPath();ctx.arc(cx-s*.33,cy-s*.15,s*.22,0,7);ctx.arc(cx+s*.33,cy-s*.15,s*.22,0,7);ctx.fill();break;
  case'brain':ctx.beginPath();ctx.arc(cx-s*.4,cy,s*.62,0,7);ctx.arc(cx+s*.4,cy,s*.62,0,7);ctx.fill();
   ctx.strokeStyle=b.c1;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(cx,cy-s*.6);ctx.lineTo(cx,cy+s*.6);ctx.stroke();break;
  case'bolt':poly([[cx+s*.2,cy-s*1.1],[cx-s*.6,cy+s*.2],[cx-s*.05,cy+s*.2],[cx-s*.25,cy+s*1.1],[cx+s*.6,cy-s*.2],[cx+s*.05,cy-s*.2]]);break;
  case'crown':poly([[cx-s,cy+s*.6],[cx-s,cy-s*.6],[cx-s*.5,cy],[cx,cy-s*.8],[cx+s*.5,cy],[cx+s,cy-s*.6],[cx+s,cy+s*.6]]);break;
  case'diamond':poly([[cx,cy-s],[cx+s*.8,cy],[cx,cy+s],[cx-s*.8,cy]]);break;
  case'heart':ctx.beginPath();ctx.arc(cx-s*.45,cy-s*.3,s*.55,0,7);ctx.arc(cx+s*.45,cy-s*.3,s*.55,0,7);ctx.fill();poly([[cx-s*.98,cy-s*.05],[cx+s*.98,cy-s*.05],[cx,cy+s]]);break;
  default:ctx.beginPath();ctx.arc(cx,cy,s*.8,0,7);ctx.fill()}}
function drawBanner(x,y,w,h,b,lock){
 ctx.save();ctx.lineWidth=2;ctx.strokeStyle='#111';
 ctx.fillStyle='#8b5a2b';ctx.fillRect(x-3,y,w+6,5);ctx.strokeRect(x-3,y,w+6,5);
 ctx.beginPath();ctx.moveTo(x+2,y+5);ctx.lineTo(x+w-2,y+5);ctx.lineTo(x+w-2,y+h);ctx.lineTo(x+w/2,y+h*.86);ctx.lineTo(x+2,y+h);ctx.closePath();
 ctx.fillStyle=lock?'#3a3f36':b.c1;ctx.fill();ctx.stroke();
 if(lock){ctx.fillStyle='#999';ctx.textAlign='center';ctx.font='bold '+Math.round(w*.5)+'px sans-serif';ctx.fillText('?',x+w/2,y+h*.58)}
 else{ctx.fillStyle=b.c2;ctx.fillRect(x+2,y+5,w-4,h*.09);symbol(b,x+w/2,y+h*.48,w*.28)}

const GFONT='Impact,"Arial Black",sans-serif';
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let gbg=null;
function getBG(){
 if(gbg&&gbg.width===W&&gbg.height===H)return gbg;
 const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d'),r=rng(11);
 // brick wall
 g.fillStyle='#2a2422';g.fillRect(0,0,W,H);
 const bh=26,bw=60;
 for(let y=0,row=0;y<H;y+=bh,row++)for(let x=-(row%2)*bw/2;x<W;x+=bw){const s=r()*30-15;g.fillStyle='rgb('+Math.round(78+s)+','+Math.round(54+s*.7)+','+Math.round(46+s*.6)+')';g.fillRect(x+1,y+1,bw-2,bh-2)}
 g.fillStyle='rgba(0,0,0,.5)';g.fillRect(0,0,W,H);
 // paint splats with drips
 for(let i=0;i<10;i++){
  const x=r()*W,y=r()*H*.8,col=NEON[i%6];g.globalAlpha=.45;g.fillStyle=col;
  g.beginPath();g.arc(x,y,18+r()*34,0,7);g.fill();
  for(let k=0;k<10;k++){g.beginPath();g.arc(x+(r()-.5)*100,y+(r()-.5)*100,2+r()*6,0,7);g.fill()}
  for(let k=0;k<3;k++){const dx=x+(r()-.5)*40,dl=30+r()*100;g.fillRect(dx-2,y,4,dl);g.beginPath();g.arc(dx,y+dl,4,0,7);g.fill()}}
 // big spray tags
 const tags=['ZOMBIE CREW','SURVIVE','R.I.P.','BRAINS','WAVE 99','NO FEAR'];
 g.textAlign='center';g.lineJoin='round';
 tags.forEach((t,i)=>{
  const size=Math.max(26,Math.min(64,W/9)),x=(i%3+.5)*W/3+(r()-.5)*40,y=H*(i<3?.42:.8)+(r()-.5)*40;
  g.save();g.translate(x,y);g.rotate((r()-.5)*.5);g.globalAlpha=.55;
  g.font='italic 900 '+size+'px '+GFONT;g.lineWidth=size*.2;g.strokeStyle='#000';g.strokeText(t,0,0);
  g.fillStyle=NEON[(i*2+1)%6];g.fillText(t,0,0);g.restore()});
 g.globalAlpha=1;
 gbg=c;return c}

function loop(now){const dt=Math.min((now-last)/1000,.05);last=now;T=now/1000;if(state==='play')update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
